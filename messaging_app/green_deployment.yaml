apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-messaging-green
  namespace: default
  labels:
    app: django-messaging
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-messaging
      version: green
  template:
    metadata:
      labels:
        app: django-messaging
        version: green
    spec:
      containers:
      - name: django-messaging-app
        image: <your-dockerhub-username>/django-messaging-app:v2  # Green version (new)
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "<your-database-url>"  # Replace with your database connection string
        - name: DJANGO_SECRET_KEY
          value: "<your-secret-key>"  # Replace with your Django secret key
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"